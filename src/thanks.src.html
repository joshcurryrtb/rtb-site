<!-- title: You're booked | RTB Gym |desc: Booking confirmed. -->
<section class="hero">
  <div class="wrap">
    <div class="eyebrow"><span class="pill hot">Confirmed</span></div>
    <h1>You're booked.<span class="kick">Check your email.</span></h1>
    <p class="sub">A confirmation is on its way with the time and everything you need. Put it in your calendar now while you're thinking about it. If anything changes, reply to that email and we'll sort it.</p>
    <div class="ctarow"><a href="index.html" class="cta ghost">Back to the site</a><a href="app.html" class="cta">See the program app</a></div>
  </div>
</section>
<script>
/* One count per booking. This page reloads (refresh, back button, reopened tab) and each load used to fire
   Lead + Schedule again, inflating Ads Manager. Fire once per browser per 12 hours, with an eventID so Meta can
   dedupe anything that still slips through. */
(function(){var src=(location.search.match(/src=([a-z]+)/)||[])[1]||'unknown';
var key='rtb_booked_'+src, now=Date.now(), last=0;
try{last=+localStorage.getItem(key)||0}catch(e){}
if(now-last<12*3600*1000)return;
try{localStorage.setItem(key,String(now))}catch(e){}
var id='bk_'+src+'_'+now.toString(36)+Math.random().toString(36).slice(2,7);
if(window.fbq){fbq('track','Lead',{content_name:'RTB '+src,value:0,currency:'AUD'},{eventID:id+'_l'});fbq('track','Schedule',{content_name:'RTB '+src},{eventID:id+'_s'});}
if(window.gtag){gtag('event','generate_lead',{event_label:src});}})();
</script>
